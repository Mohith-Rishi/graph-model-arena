services:
  arena:
    build: .
    volumes:
      - ./game_results.json:/app/game_results.json
    command: ["--num-models", "4", "--num-nodes", "30", "--max-turns", "50"]

  test:
    build: .
    entrypoint: ["pytest"]
    command: ["-v"]
    profiles:
      - testing

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./game_results.json:/usr/share/nginx/html/game_results.json:ro
    profiles:
      - frontend
